services:
  postgres:
    image: postgres:15.1-alpine
    container_name: database-tournament
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DATABASE:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_USERNAME:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5440:5432"